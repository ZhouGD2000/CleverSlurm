name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    env:
      CSLURM_RUN_REAL_SLURM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Offline installer tests build wheels in the running Python environment.
      - run: python -m pip install -e . pytest setuptools wheel
      - run: python -m pytest -q
  real-slurm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CSLURM_RUN_REAL_SLURM: 'true'
      CSLURM_REQUIRE_REAL_SLURM: 'true'
      CSLURM_NOTIFICATION_ENABLED: 'false'
      CSLURM_AI_AUTO_SUMMARY: 'false'
      CSLURM_REAL_SLURM_PARTITION: debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install -y slurm-wlm slurmdbd munge mariadb-server
      - run: sudo --preserve-env=GITHUB_ACTIONS python3 ci/setup_slurm.py
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q -m real_slurm
      - name: Slurm diagnostics
        if: always()
        run: sudo journalctl -u slurmctld -u slurmd -u slurmdbd --no-pager -n 120
